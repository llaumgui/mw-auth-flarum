name: Run all tests and checks
on:
  [push, pull_request]

jobs:

  ##############################################################################
  # Tests job
  #
  test_php:
    runs-on: ubuntu-latest
    name: Test
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5', '8.6']
    steps:

    - name: Git checkout
      uses: actions/checkout@v7

    # Setup PHP
    - name: Setup PHP ${{ matrix.php-version }} with PECL extension
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: xdebug
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    # Install & run tasks
    - name: Validate composer.json and composer.lock
      run: composer validate --strict
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    - name: Run test suite
      run: composer run-script test
    - name: Upload Sonar coverage report
      uses: actions/upload-artifact@v7
      with:
        name: sonar-php-coverage
        path: coverage.xml
        if-no-files-found: error



  ##############################################################################
  # Markdownlint job
  #
  test_markdownlint:
    runs-on: ubuntu-latest
    name: MarkdownLint
    steps:
    - name: Git checkout
      uses: actions/checkout@v7

    # Run markdownlint-cli
    - name: markdownlint-cli
      uses: nosborn/github-action-markdown-cli@v3.5.0
      with:
        files: "*.md"
        config_file: ".markdownlint.yaml"



  ##############################################################################
  # SonarCloud job
  #
  test_sonar:
    needs: [
      test_php,
      test_markdownlint
    ]
    if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    name: SonarCloud analyse
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Disabling shallow clones is recommended for improving the relevancy of reporting
    - name: Download Sonar coverage report
      uses: actions/download-artifact@v7
      with:
        name: sonar-php-coverage
    # https://docs.sonarsource.com/sonarqube/latest/project-administration/analysis-scope/#sonarqube-respects-ignored-files
    - run: rm .gitignore
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8.5.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
